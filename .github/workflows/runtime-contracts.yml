name: Runtime contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lab/browser/**'
      - 'profiles/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/runtime-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared provider-neutral contract tests
        shell: pwsh
        run: ./scripts/Test-OctaneRuntimeContracts.ps1 -Scope All

  live-browser-acceptance:
    if: ${{ false }}
    runs-on: self-hosted
    steps:
      - run: echo "Intentionally disabled until a trusted WSL/Docker/approved-browser runner is configured."
