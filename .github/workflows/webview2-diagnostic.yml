name: WebView2 diagnostic
on:
  push:
    branches: [main]
    paths:
      - diagnostics/webview2-win32/**
      - scripts/Build-WebView2Diagnostic.ps1
      - .github/workflows/webview2-diagnostic.yml
  pull_request:
    paths:
      - diagnostics/webview2-win32/**
      - scripts/Build-WebView2Diagnostic.ps1
      - .github/workflows/webview2-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
        with:
          nuget-version: 6.x
      - name: Build and stage native x64 diagnostic
        shell: pwsh
        run: ./scripts/Build-WebView2Diagnostic.ps1
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: WebView2Diagnostic-windows-x64
          path: diagnostics/webview2-win32/artifacts/*
          if-no-files-found: error
          retention-days: 14
