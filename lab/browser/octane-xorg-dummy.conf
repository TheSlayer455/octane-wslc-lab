Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowMouseOpenFail" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection

Section "Device"
    Identifier "OctaneDummyDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "OctaneDummyMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1280x800" 83.46 1280 1344 1480 1680 800 801 804 828
EndSection

Section "Screen"
    Identifier "OctaneDummyScreen"
    Device "OctaneDummyDevice"
    Monitor "OctaneDummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x800"
        Virtual 1280 800
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "OctaneDummyLayout"
    Screen "OctaneDummyScreen"
EndSection
