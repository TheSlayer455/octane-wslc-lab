<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octane browser viewer</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111827; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem 1rem; min-height: 52px; padding: .6rem 1rem; background: #172033; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1rem; white-space: nowrap; }
    #state { border-radius: 999px; padding: .25rem .65rem; background: #334155; font-weight: 650; }
    #state[data-state="vnc-negotiated"] { color: #052e16; background: #86efac; }
    #state[data-state$="failed"], #state[data-state="disconnected-unclean"] { color: #450a0a; background: #fca5a5; }
    #session { margin-left: auto; color: #cbd5e1; font-size: .8rem; text-align: right; }
    #screen { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #020617; }
    #login { position: absolute; z-index: 5; inset: 0; display: grid; place-items: center; background: rgb(2 6 23 / .78); }
    #login[hidden] { display: none; }
    form { width: min(430px, calc(100% - 2rem)); padding: 1.4rem; border: 1px solid #475569; border-radius: .75rem; background: #172033; box-shadow: 0 1rem 3rem #0008; }
    label { display: block; margin-bottom: .45rem; font-weight: 650; }
    input, button { width: 100%; min-height: 42px; border: 1px solid #64748b; border-radius: .4rem; padding: .55rem .7rem; font: inherit; }
    input { color: #f8fafc; background: #0f172a; }
    button { margin-top: .75rem; border-color: #38bdf8; color: #082f49; background: #7dd3fc; font-weight: 750; cursor: pointer; }
    .note { color: #cbd5e1; font-size: .85rem; }
    #history { max-height: 7rem; overflow: auto; margin: .9rem 0 0; padding-left: 1.25rem; color: #94a3b8; font-size: .78rem; }
    #upload-panel { display: flex; align-items: center; gap: .45rem; min-width: min(100%, 430px); }
    #upload-panel[hidden] { display: none; }
    #upload-file { width: min(260px, 42vw); min-height: 34px; padding: .3rem; }
    #upload-button { width: auto; min-height: 34px; margin: 0; padding: .35rem .65rem; }
    #upload-status { max-width: 19rem; overflow: hidden; color: #cbd5e1; font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <h1>Octane browser viewer</h1>
    <span id="state" data-state="viewer-page-loaded">Viewer page loaded</span>
    <div id="upload-panel" hidden>
      <label for="upload-file" class="note">Add run input</label>
      <input id="upload-file" type="file" multiple>
      <button id="upload-button" type="button" disabled>Stage</button>
      <span id="upload-status" role="status">Connect first</span>
    </div>
    <span id="session">Loading session identity…</span>
  </header>
  <main id="screen" aria-label="Remote desktop canvas">
    <div id="login">
      <form id="login-form" autocomplete="off">
        <label for="password">Per-run viewer password</label>
        <input id="password" type="password" required autocomplete="off" spellcheck="false">
        <button type="submit">Connect to this run</button>
        <p class="note">The password remains in browser memory only and is never placed in the URL. A VNC connection does not, by itself, establish application readiness.</p>
        <ol id="history" aria-label="Viewer state history"></ol>
      </form>
    </div>
  </main>
  <script type="module">
    import RFB from './core/rfb.js';

    const stateNode = document.querySelector('#state');
    const historyNode = document.querySelector('#history');
    const loginNode = document.querySelector('#login');
    const form = document.querySelector('#login-form');
    const passwordNode = document.querySelector('#password');
    const sessionNode = document.querySelector('#session');
    const screenNode = document.querySelector('#screen');
    const uploadPanel = document.querySelector('#upload-panel');
    const uploadFile = document.querySelector('#upload-file');
    const uploadButton = document.querySelector('#upload-button');
    const uploadStatus = document.querySelector('#upload-status');
    let rfb = null;
    let pendingCredential = '';
    let uploadCredential = '';
    let uploadUrl = null;
    let sessionRunId = null;
    let inputFlushTimer = null;
    let frameTimer = null;
    const inputCounts = { pointer: 0, keyboard: 0, wheel: 0 };

    function record(state, label) {
      stateNode.dataset.state = state;
      stateNode.textContent = label;
      const item = document.createElement('li');
      item.dataset.state = state;
      item.textContent = `${new Date().toISOString()} — ${label}`;
      historyNode.append(item);
      console.info('octane-viewer-state', { state, label });
    }

    async function loadSession() {
      try {
        const response = await fetch('./octane-session.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const value = await response.json();
        sessionRunId = value.runId;
        sessionNode.textContent = `run ${value.runId} · ${value.display} · ${value.resolution}`;
        if (value.uploadUrl) {
          const candidate = new URL(value.uploadUrl);
          if (!['127.0.0.1', 'localhost'].includes(candidate.hostname) || !['http:', 'https:'].includes(candidate.protocol)) {
            throw new Error('Upload endpoint is not an approved localhost URL');
          }
          uploadUrl = candidate;
          uploadPanel.hidden = false;
          uploadStatus.textContent = 'Connect first';
        }
      } catch (error) {
        sessionNode.textContent = 'Session identity unavailable';
      }
    }

    async function postViewerEvent(event, detail = {}) {
      if (!uploadUrl || !uploadCredential) return;
      const endpoint = new URL('/viewer-event', uploadUrl);
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${uploadCredential}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ event, runId: sessionRunId, detail }),
        cache: 'no-store',
      });
      if (!response.ok) throw new Error(`Viewer evidence HTTP ${response.status}`);
    }

    async function captureBrowserFrame(reason) {
      const canvas = screenNode.querySelector('canvas');
      if (!canvas || canvas.width < 1 || canvas.height < 1) return;
      const context = canvas.getContext('2d', { willReadFrequently: true });
      if (!context) return;
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      const digest = await crypto.subtle.digest('SHA-256', pixels.buffer);
      const sha256 = Array.from(new Uint8Array(digest), value => value.toString(16).padStart(2, '0')).join('');
      const colors = new Set();
      const pixelCount = canvas.width * canvas.height;
      const stride = Math.max(1, Math.floor(pixelCount / 4096));
      for (let pixel = 0; pixel < pixelCount; pixel += stride) {
        const offset = pixel * 4;
        colors.add(`${pixels[offset]},${pixels[offset + 1]},${pixels[offset + 2]},${pixels[offset + 3]}`);
      }
      await postViewerEvent('browser-frame', {
        reason,
        canvasWidth: canvas.width,
        canvasHeight: canvas.height,
        sampledUniqueColors: colors.size,
        rgbaSha256: sha256,
      });
    }

    function scheduleFrame(reason) {
      clearTimeout(frameTimer);
      frameTimer = setTimeout(() => captureBrowserFrame(reason).catch(error => console.warn('octane-viewer-frame-evidence', error)), 650);
    }

    function observeBrowserInput(kind) {
      if (!rfb || !loginNode.hidden) return;
      inputCounts[kind] += 1;
      clearTimeout(inputFlushTimer);
      inputFlushTimer = setTimeout(() => {
        postViewerEvent('browser-input', { ...inputCounts }).catch(error => console.warn('octane-viewer-input-evidence', error));
        scheduleFrame('after-browser-input');
      }, 250);
    }

    screenNode.addEventListener('pointerdown', () => observeBrowserInput('pointer'), true);
    screenNode.addEventListener('wheel', () => observeBrowserInput('wheel'), true);
    document.addEventListener('keydown', () => observeBrowserInput('keyboard'), true);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const password = passwordNode.value;
      pendingCredential = password;
      passwordNode.value = '';
      if (rfb) rfb.disconnect();
      record('websocket-attempted', 'WebSocket connection attempted');
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${scheme}://${location.host}/websockify`;
      rfb = new RFB(screenNode, url, { credentials: { password } });
      rfb.scaleViewport = true;
      rfb.resizeSession = false;
      rfb.viewOnly = false;
      rfb.clipViewport = false;
      rfb.addEventListener('credentialsrequired', () => {
        loginNode.hidden = false;
        record('credentials-required', 'Authentication required');
        passwordNode.focus();
      });
      rfb.addEventListener('securityfailure', (event) => {
        pendingCredential = '';
        uploadCredential = '';
        uploadButton.disabled = true;
        loginNode.hidden = false;
        record('security-negotiation-failed', `Security negotiation failed${event.detail?.reason ? `: ${event.detail.reason}` : ''}`);
      });
      rfb.addEventListener('connect', () => {
        uploadCredential = pendingCredential;
        pendingCredential = '';
        uploadButton.disabled = !uploadUrl;
        if (uploadUrl) uploadStatus.textContent = 'Ready for explicit file selection';
        loginNode.hidden = true;
        record('vnc-negotiated', 'VNC negotiated; application readiness unverified');
        postViewerEvent('vnc-negotiated', { displayTarget: 'noVNC canvas' }).catch(error => console.warn('octane-viewer-connect-evidence', error));
        scheduleFrame('after-vnc-negotiation');
      });
      rfb.addEventListener('disconnect', (event) => {
        pendingCredential = '';
        uploadCredential = '';
        uploadButton.disabled = true;
        loginNode.hidden = false;
        record(event.detail.clean ? 'disconnected-clean' : 'disconnected-unclean', event.detail.clean ? 'Disconnected' : 'Disconnected unexpectedly');
      });
      rfb.addEventListener('desktopname', (event) => {
        document.title = `Octane viewer — ${event.detail.name}`;
      });
    });

    uploadButton.addEventListener('click', async () => {
      const files = Array.from(uploadFile.files || []);
      if (!uploadUrl || !uploadCredential || files.length === 0) {
        uploadStatus.textContent = 'Select at least one file after connecting';
        return;
      }
      uploadButton.disabled = true;
      try {
        for (const file of files) {
          uploadStatus.textContent = `Staging ${file.name}…`;
          const endpoint = new URL('/upload', uploadUrl);
          endpoint.searchParams.set('name', file.name);
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${uploadCredential}`, 'Content-Type': 'application/octet-stream' },
            body: file,
            cache: 'no-store',
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || `HTTP ${response.status}`);
          uploadStatus.textContent = `Staged ${result.name} · ${result.sha256.slice(0, 12)}…`;
        }
        uploadFile.value = '';
      } catch (error) {
        uploadStatus.textContent = `Upload failed: ${error.message}`;
      } finally {
        uploadButton.disabled = !uploadUrl || !uploadCredential;
      }
    });

    record('viewer-page-loaded', 'Viewer page loaded');
    loadSession();
    passwordNode.focus();
  </script>
</body>
</html>
