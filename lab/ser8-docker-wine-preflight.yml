---
- name: Preflight the SER8 for an isolated Octane Docker-Wine run
  hosts: ser8
  gather_facts: false
  vars:
    octane_bind_address: "{{ octane_bind_address_required | default('100.103.13.4') }}"
    octane_rdp_port: "{{ octane_rdp_port_required | default(3391) | int }}"
  tasks:
    - name: Verify the nonprivileged automation identity
      ansible.builtin.command: id -un
      register: octane_identity
      changed_when: false

    - name: Verify the target hostname
      ansible.builtin.command: hostname
      register: octane_hostname
      changed_when: false

    - name: Read the target architecture
      ansible.builtin.command: uname -m
      register: octane_arch
      changed_when: false

    - name: Read Docker and capacity facts
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        docker version --format 'docker_server={{ "{{" }}.Server.Version{{ "}}" }}'
        docker info --format 'docker_arch={{ "{{" }}.Architecture{{ "}}" }}'
        docker info --format 'docker_root={{ "{{" }}.DockerRootDir{{ "}}" }}'
        df -PB1 /var/lib/docker | awk 'NR==2 {print "docker_free_bytes=" $4}'
        awk '/MemAvailable:/ {print "memory_available_bytes=" $2 * 1024}' /proc/meminfo
        ip -4 -o addr show dev tailscale0 | awk '{split($4,a,"/"); print "tailscale_ipv4=" a[1]}'
        if ss -H -ltn '( sport = :{{ octane_rdp_port }} )' | grep -q .; then
          echo rdp_port=IN_USE
        else
          echo rdp_port=FREE
        fi
        echo running_containers=$(docker ps -q | wc -l)
        echo existing_octane=$(docker ps -a -q --filter label=com.octanelab.remote=ser8 | wc -l)
      args:
        executable: /bin/bash
      register: octane_capacity
      changed_when: false

    - name: Enforce the isolated-run prerequisites
      ansible.builtin.assert:
        that:
          - octane_identity.stdout == 'svc.ansible'
          - octane_hostname.stdout == 'jakeubuntu'
          - octane_arch.stdout == 'x86_64'
          - octane_bind_address in ['100.103.13.4', '192.168.1.159']
          - octane_rdp_port | int >= 1024
          - octane_rdp_port | int <= 65535
          - "'docker_arch=x86_64' in octane_capacity.stdout"
          - "'rdp_port=FREE' in octane_capacity.stdout"
          - "'existing_octane=0' in octane_capacity.stdout"
        fail_msg: The SER8 identity, architecture, endpoint, or isolation gate failed.

    - name: Report the reviewed preflight facts
      ansible.builtin.debug:
        msg:
          identity: "{{ octane_identity.stdout }}"
          hostname: "{{ octane_hostname.stdout }}"
          architecture: "{{ octane_arch.stdout }}"
          bind_address: "{{ octane_bind_address }}"
          rdp_port: "{{ octane_rdp_port }}"
          capacity: "{{ octane_capacity.stdout_lines }}"
